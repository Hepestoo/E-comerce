<h2>Gestión de Subcategorías</h2>

<section class="formulario-subcategoria">
  <h3>{{ nueva.id !== null ? 'Editar Subcategoría' : 'Nueva Subcategoría' }}</h3>

  <form (ngSubmit)="guardar()" #form="ngForm" class="form-grid-sub">
    <div>
      <label for="nombre">Nombre</label>
      <input type="text" [(ngModel)]="nueva.nombre" name="nombre" id="nombre" required />
    </div>

    <div>
      <label for="categoria_id">Categoría</label>
      <select [(ngModel)]="nueva.categoria_id" name="categoria_id" id="categoria_id" required>
        <option [ngValue]="undefined" disabled selected>Seleccione categoría</option>
        <option *ngFor="let cat of categorias" [value]="cat.id">{{ cat.nombre }}</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-guardar" [disabled]="form.invalid">
        <i class="pi pi-save"></i>
        {{ nueva.id !== null ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>
  </form>
</section>

<section class="lista-subcategorias">
  <h3>Listado de Subcategorías</h3>

  <div class="lista-items">
    <div class="item-header">
      <div class="header-nombre">Nombre</div>
      <div class="header-categoria">Categoría</div>
      <div class="header-acciones">Acciones</div>
    </div>
    
    <div class="item-row" *ngFor="let sub of subcategorias">
      <div class="item-info">
        <h4>{{ sub.nombre }}</h4>
        <p>{{ sub.categoria?.nombre }}</p>
      </div>
      <div class="item-categoria">
        <span class="categoria-badge">{{ sub.categoria?.nombre }}</span>
      </div>
      <div class="item-acciones">
        <button class="btn-editar" (click)="editar(sub)">
          <i class="pi pi-pencil"></i> Editar
        </button>
        <button class="btn-eliminar" (click)="eliminar(sub.id)">
          <i class="pi pi-trash"></i> Eliminar
        </button>
      </div>
    </div>

    <div *ngIf="subcategorias.length === 0" class="item-vacio">
      <p>No hay subcategorías para mostrar.</p>
    </div>

  </div>
</section>
