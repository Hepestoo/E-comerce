<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Panel de administración</h1>
    <button class="logout-btn" (click)="logout()">Cerrar sesión</button>
  </div>

  <div class="dashboard-body">
    <aside class="dashboard-sidebar">
      <button (click)="mostrarVista('productos')" [class.active]="vistaActual === 'productos'">
        <i class="pi pi-box"></i> Productos
      </button>
      <button (click)="mostrarVista('subcategorias')" [class.active]="vistaActual === 'subcategorias'">
        <i class="pi pi-tags"></i> Subcategorías
      </button>
      <button (click)="mostrarVista('ordenes')" [class.active]="vistaActual === 'ordenes'">
        <i class="pi pi-shopping-cart"></i> Órdenes
      </button>
      <button (click)="mostrarVista('pagos')" [class.active]="vistaActual === 'pagos'">
        <i class="pi pi-credit-card"></i> Pagos
      </button>
    </aside>

    <main class="dashboard-content">
      <div *ngIf="vistaActual === 'productos'">
        <app-productos></app-productos>
      </div>

      <div *ngIf="vistaActual === 'subcategorias'">
        <app-subcategorias></app-subcategorias>
      </div>

      <div *ngIf="vistaActual === 'ordenes'">
        <app-ordenes></app-ordenes>
      </div>

      <div *ngIf="vistaActual === 'pagos'">
        <app-pagos></app-pagos>
      </div>
    </main>
  </div>
</div>
