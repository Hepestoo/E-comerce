
<div class="admin-page">
  
  <div class="page-header">
    <div>
      <h2>Métodos de Pago</h2>
      <p>Configura las opciones para que tus clientes te paguen</p>
    </div>
    <button class="btn-create" (click)="mostrarFormulario = !mostrarFormulario">
      <i class="pi" [ngClass]="mostrarFormulario ? 'pi-times' : 'pi-plus'"></i>
      {{ mostrarFormulario ? 'Cancelar' : 'Nuevo Método' }}
    </button>
  </div>

  <!-- FORMULARIO DESPLEGABLE -->
  <div class="form-container" [class.open]="mostrarFormulario">
    <div class="form-card">
      <h3>{{ nuevoMetodo.id ? 'Editar Método' : 'Crear Nuevo Método' }}</h3>
      
      <form (ngSubmit)="guardar()">
        <div class="form-grid">
          <div class="form-group">
            <label>Nombre del Método</label>
            <input type="text" [(ngModel)]="nuevoMetodo.nombre" name="nombre" placeholder="Ej: Transferencia Bancaria" required>
          </div>
          
          <div class="form-group full-width">
            <label>Instrucciones para el Cliente</label>
            <textarea [(ngModel)]="nuevoMetodo.descripcion" name="descripcion" rows="3" placeholder="Ej: Depositar al CBU: 000... Banco Pichincha. Enviar comprobante al WhatsApp."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-save" [disabled]="!nuevoMetodo.nombre">
            <i class="pi pi-check"></i> Guardar Método
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- GRID DE TARJETAS -->
  <div class="grid-container" *ngIf="metodos.length > 0; else emptyState">
    
    <div class="payment-card" *ngFor="let m of metodos">
      <!-- Icono -->
      <div class="card-icon">
        <i class="pi pi-wallet"></i>
      </div>

      <!-- Info -->
      <div class="card-info">
        <h4>{{ m.nombre }}</h4>
        <p class="desc">{{ m.descripcion || 'Sin instrucciones adicionales.' }}</p>
      </div>

      <!-- Acciones -->
      <div class="card-actions">
        <button class="btn-icon edit" (click)="editar(m)" title="Editar">
          <i class="pi pi-pencil"></i>
        </button>
        <button class="btn-icon delete" (click)="eliminar(m.id)" title="Eliminar">
          <i class="pi pi-trash"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- Estado Vacío -->
  <ng-template #emptyState>
    <div class="empty-state">
      <div class="icon-circle"><i class="pi pi-credit-card"></i></div>
      <h3>No hay métodos de pago</h3>
      <p>Agrega opciones como Transferencia o Efectivo.</p>
    </div>
  </ng-template>

</div>
