<h2>Gestión de Productos</h2>

<section class="formulario-producto">
  <h3>{{ nuevoProducto.id ? 'Editar Producto' : 'Nuevo Producto' }}</h3>

  <form (ngSubmit)="guardar()" #form="ngForm" enctype="multipart/form-data" class="form-grid">
    <div>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" [(ngModel)]="nuevoProducto.nombre" name="nombre" required />
    </div>

    <div>
      <label for="descripcion">Descripción</label>
      <input type="text" id="descripcion" [(ngModel)]="nuevoProducto.descripcion" name="descripcion" required />
    </div>

    <div>
      <label for="precio">Precio</label>
      <input type="number" id="precio" [(ngModel)]="nuevoProducto.precio" name="precio" required />
    </div>

    <div>
      <label for="stock">Stock</label>
      <input type="number" id="stock" [(ngModel)]="nuevoProducto.stock" name="stock" required />
    </div>

    <div>
      <label for="subcategoria">Subcategoría</label>
      <select id="subcategoria" [(ngModel)]="nuevoProducto.subcategoria_id" name="subcategoria_id" required>
        <option [ngValue]="undefined" disabled>Seleccione subcategoría</option>
        <option *ngFor="let cat of subcategorias" [value]="cat.id">
          {{ cat.nombre }}
        </option>
      </select>
    </div>

    <div>
      <label for="imagen">Imagen</label>
      <input type="file" id="imagen" (change)="onFileChange($event)" class="input-file" />
    </div>

    <div *ngIf="imagenPreview" class="preview-container">
      <label>Vista previa</label>
      <img [src]="imagenPreview" alt="Preview" />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-guardar" [disabled]="form.invalid">
        <i class="pi pi-save"></i>
        {{ nuevoProducto.id ? 'Actualizar' : 'Guardar' }}
      </button>
      
      </div>
  </form>
</section>

<hr class="separador">

<section class="lista-productos">
  <div class="header-lista">
    <h3>Listado de Productos</h3>
    <div class="search-wrapper">
      <i class="pi pi-search"></i>
      <input type="text" [(ngModel)]="busqueda" placeholder="Buscar producto por nombre..." class="search-input">
    </div>
  </div>

  <div class="grid-productos-admin">
    
    <div class="producto-admin-card" *ngFor="let prod of productosFiltrados">
      
      <div class="card-imagen">
        <img [src]="apiUrl + '/uploads/productos/' + prod.imagen_url" alt="Producto" />
      </div>
      
      <div class="card-info">
        <h4 class="card-nombre">{{ prod.nombre }}</h4>
        <p class="card-subcategoria">{{ prod.subcategoria.nombre }}</p>
        <p class="card-descripcion">{{ prod.descripcion }}</p>
        
        <div class="card-stats">
          <div class="stat">
            <strong>Precio:</strong>
            <span>{{ prod.precio | currency }}</span>
          </div>
          <div class="stat">
            <strong>Stock:</strong>
            <span class="stock-badge" [class.agotado]="prod.stock === 0">
              {{ prod.stock }}
            </span>
          </div>
        </div>
      </div>

      <div class="card-acciones">
        <button class="btn-editar" (click)="editar(prod)">
          <i class="pi pi-pencil"></i> Editar
        </button>
        <button class="btn-eliminar" (click)="eliminar(prod.id)">
          <i class="pi pi-trash"></i> Eliminar
        </button>
      </div>

    </div>
  </div>
  </section>
