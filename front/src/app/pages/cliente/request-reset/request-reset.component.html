<div class="auth-container">
  <!-- Fondo decorativo -->
  <div class="auth-background"></div>

  <div class="auth-card">
    
    <div class="auth-header">
      <div class="logo">
        <span>Artemania</span>
      </div>
      <h2>Recuperar Contraseña</h2>
      <p>Ingresa tu correo y te enviaremos un enlace</p>
    </div>

    <form (ngSubmit)="enviar()">
      
      <div class="form-group">
        <label>Correo electrónico</label>
        <div class="input-wrapper">
          <i class="pi pi-envelope"></i>
          <input 
            type="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="ejemplo@correo.com" 
            required>
        </div>
      </div>

      <div *ngIf="mensaje" class="success-banner">
        <i class="pi pi-check-circle"></i> {{ mensaje }}
      </div>
      
      <div *ngIf="error" class="error-banner">
        <i class="pi pi-exclamation-circle"></i> {{ error }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading || !email">
        {{ loading ? 'Enviando...' : 'Enviar Enlace' }}
      </button>

    </form>
    
    <div class="auth-footer">
      <a routerLink="/login" class="back-link">
        <i class="pi pi-arrow-left"></i> Volver al Login
      </a>
    </div>
  </div>
</div>
