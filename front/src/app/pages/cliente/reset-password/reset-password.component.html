<div class="auth-container">
  <div class="auth-card">
    
    <div class="auth-header">
      <div class="logo">
        <span>Artemania</span>
      </div>
      <h2>Nueva Contraseña</h2>
      <p>Crea una clave segura para tu cuenta</p>
    </div>

    <form (ngSubmit)="cambiar()">
      
      <div class="form-group">
        <label>Nueva Contraseña</label>
        <div class="input-wrapper">
          <i class="pi pi-lock"></i>
          <input 
            type="password" 
            [(ngModel)]="password" 
            (input)="onPasswordChange()"
            name="password" 
            placeholder="Ingresa tu nueva clave" 
            required>
        </div>
      </div>

      <!-- LISTA DE VALIDACIONES ESTILIZADA -->
      <div class="validation-list">
        <div class="validation-item" [class.valid]="hasMinLength">
          <i class="pi" [ngClass]="hasMinLength ? 'pi-check-circle' : 'pi-circle'"></i>
          <span>Mínimo 6 caracteres</span>
        </div>
        <div class="validation-item" [class.valid]="hasUpperCase">
          <i class="pi" [ngClass]="hasUpperCase ? 'pi-check-circle' : 'pi-circle'"></i>
          <span>Una letra mayúscula</span>
        </div>
        <div class="validation-item" [class.valid]="hasSpecialChar">
          <i class="pi" [ngClass]="hasSpecialChar ? 'pi-check-circle' : 'pi-circle'"></i>
          <span>Un número o símbolo especial</span>
        </div>
      </div>

      <div *ngIf="mensaje" class="success-banner">
        <i class="pi pi-check-circle"></i> {{ mensaje }}
      </div>

      <div *ngIf="error" class="error-banner">
        <i class="pi pi-exclamation-circle"></i> {{ error }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading || !isPasswordValid">
        {{ loading ? 'Guardando...' : 'Cambiar Contraseña' }}
      </button>

    </form>
  </div>
</div>
