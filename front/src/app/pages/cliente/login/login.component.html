<section class="auth-page">
  <div class="auth-card">
    <!-- Botón Volver -->
    <a routerLink="/home" class="btn-back">
      <i class="pi pi-arrow-left"></i> Atrás
    </a>

    <!-- Cabecera -->
    <div class="card-header">
      <h1>Artemania</h1>
      <h2>¡Hola de nuevo!</h2>
      <p>Ingresa para continuar creando</p>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="login()" #loginForm="ngForm">
      
      <div class="input-group">
        <label>Correo electrónico</label>
        <div class="input-wrapper">
          <i class="pi pi-envelope"></i>
          <input 
            type="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="ejemplo@correo.com" 
            required>
        </div>
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <i class="pi pi-lock"></i>
          <input 
            [type]="mostrarPassword ? 'text' : 'password'" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="••••••••" 
            required>
          <i class="pi toggle-pass" 
             [ngClass]="mostrarPassword ? 'pi-eye-slash' : 'pi-eye'" 
             (click)="togglePasswordVisibility()">
          </i>
        </div>
      </div>

      <div class="forgot-pass">
        <a routerLink="/recuperar-password">¿Olvidaste tu contraseña?</a>
      </div>

      <div *ngIf="error" class="error-msg">
        <i class="pi pi-info-circle"></i> {{ error }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>

    </form>

    <!-- Footer -->
    <div class="card-footer">
      <p>¿No tienes cuenta? <a routerLink="/register">Regístrate gratis</a></p>
    </div>
  </div>
</section>
