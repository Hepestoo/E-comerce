<div class="auth-container">
  <!-- Fondo decorativo -->
  <div class="auth-background"></div>

  <div class="auth-card">
    
    <!-- Cabecera con Logo -->
    <div class="auth-header">
      <div class="logo">
        <span>Artemania</span>
      </div>
      <h2>Crear Cuenta</h2>
      <p>Únete a nuestra comunidad creativa</p>
    </div>

    <!-- Formulario -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      <!-- Fila para Nombre y Apellido -->
      <div class="form-row">
        <div class="form-group half">
          <label>Nombre</label>
          <div class="input-wrapper simple">
            <input 
              type="text" 
              formControlName="nombre" 
              placeholder="Juan" 
              required>
          </div>
        </div>
        <div class="form-group half">
          <label>Apellido</label>
          <div class="input-wrapper simple">
            <input 
              type="text" 
              formControlName="apellido" 
              placeholder="Pérez" 
              required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Correo electrónico</label>
        <div class="input-wrapper">
          <i class="pi pi-envelope"></i>
          <input 
            type="email" 
            formControlName="email" 
            placeholder="ejemplo@correo.com" 
            required>
        </div>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <i class="pi pi-lock"></i>
          <input 
            type="password" 
            formControlName="password" 
            placeholder="Mínimo 6 caracteres" 
            required>
        </div>
        <small class="hint">Usa letras y números para mayor seguridad</small>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="error" class="error-banner">
        <i class="pi pi-exclamation-triangle"></i> {{ error }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="registerForm.invalid || loading">
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>

    </form>

    <!-- Footer de la tarjeta -->
    <div class="auth-footer">
      <p>¿Ya tienes cuenta? <a routerLink="/login">Iniciar Sesión</a></p>
      <a routerLink="/home" class="back-link">
        <i class="pi pi-arrow-left"></i> Volver al inicio
      </a>
    </div>
  </div>
</div>
